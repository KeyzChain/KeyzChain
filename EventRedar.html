<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Radar - Collabfest</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #fef9e4; 
            color: #5d5d5d;
            box-sizing: border-box;
        }

        .navbar {
            background-color: #000000f2;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar .logo {
            font-size: 24px;
            font-weight: bold;
            color: #d1ad6b;
        }

        .navbar .menu {
            display: flex;
            gap: 20px;
        }

        .navbar .menu a {
            text-decoration: none;
            color: white;
            font-size: 18px;
        }

        .navbar .menu a:hover {
            color: #d1ad6b;
            text-shadow: 0 0 10px #d1ad6b, 0 0 20px #d1ad6b, 0 0 30px #d1ad6b;
        }

        .burger-menu {
            display: none;
            flex-direction: column;
            gap: 5px;
        }

        .burger-menu div {
            width: 30px;
            height: 3px;
            background-color: white;
        }

        .logo a {
            color: white;
            text-decoration: none;
        }

        @media screen and (max-width: 768px) {
            .navbar .menu {
                display: none;
                flex-direction: column;
                gap: 15px;
                position: absolute;
                top: 60px;
                right: 0;
                background-color: #000000f2;
                padding: 20px;
                width: 200px;
            }

            .navbar.active .menu {
                display: flex;
            }

            .burger-menu {
                display: flex;
            }
        }

        header {
            text-align: center;
            padding: 20px;
            font-size: 2.8em;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 2px solid #d1ad6b;
        }

        header span {
            color: #393424;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        .event-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .event-card:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
        }

        .event-title {
            font-size: 2em;
            font-weight: bold;
            color: #3a3020;
            margin-bottom: 15px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4);
        }

        .event-description {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #000000;
        }

        .event-link {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            font-size: 1.1em;
            border: 2px solid #007bff;
            padding: 10px 20px;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .event-link:hover {
            background-color: #007bff;
            color: white;
            transform: scale(1.1);
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 1em;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.1);
            border-top: 2px solid #d1ad6b;
        }
    </style>
</head>

<body>
    <div class="navbar">
        <div class="logo"><a href="index.html">KeyzChain</a></div>
        <div class="menu">
            
            <a href="#home">Home</a>
            <a href="ambassadors.html">Our Ambassadors</a>
            <a href="EventRedar.html">Event Radar</a>
            <a href="helpfix.html">HelpFix</a>
            <a href="dedication.html">Dedication</a>
       
        </div>
        <div class="burger-menu" onclick="toggleMenu()">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>

    <header><span>Event Radar</span></header>

    <div class="container" id="event-container">
        <!-- Dynamic event cards will be injected here -->
    </div>

    <footer>2024 Event Radar. All rights reserved</footer>

    <script>
        function toggleMenu() {
            document.querySelector('.navbar').classList.toggle('active');
        }

        async function fetchEvents() {
            const response = await fetch('https://script.google.com/macros/s/AKfycbxcVNsACCwj_oQ6cfOjufw-ynwBNt6K8cIZkRKiKlfGbOA50usQxnTJQp-hrlnWwCdSHQ/exec');
            const events = await response.json();
            const container = document.getElementById('event-container');

            events.forEach(event => {
                const eventCard = document.createElement('div');
                eventCard.className = 'event-card';
                eventCard.innerHTML = `
                    <div class="event-title">${event.title}</div>
                    <div class="event-description">${event.description}</div>
                    <a class="event-link" href="${event.link}" target="_blank">Register Now</a>
                `;
                container.appendChild(eventCard);
            });
        }

        fetchEvents();
    </script>
</body>

</html>
